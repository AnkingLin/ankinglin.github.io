<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 文件读取与展示</title>
</head>

<body>
    <input type="file" id="csvFileInput" accept=".csv">
    <div id="csvDataDisplay"></div>

    <script>
        const csvFileInput = document.getElementById('csvFileInput');
        const csvDataDisplay = document.getElementById('csvDataDisplay');

        csvFileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const csvText = e.target.result;
                    const rows = csvText.split('\n');
                    const table = document.createElement('table');
                    table.id="table";
                    rows.forEach((rowText) => {
                        const row = document.createElement('tr');
                        const cells = parseCsvRow(rowText);
                        cells.forEach((cellText) => {
                            const cell = document.createElement('td');
                            cell.textContent = cellText;
                            row.appendChild(cell);
                        });
                        table.appendChild(row);
                    });
                    csvDataDisplay.innerHTML = '';
                    csvDataDisplay.appendChild(table);
                };
                reader.readAsText(file);
            }
        });

        function parseCsvRow(rowText) {
            const cells = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < rowText.length; i++) {
                const char = rowText[i];
                if (char === '"') {
                    if (inQuotes) {
                        if (i + 1 < rowText.length && rowText[i + 1] === '"') {
                            // 处理双引号转义
                            currentCell += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        inQuotes = true;
                    }
                } else if (char === ',' &&!inQuotes) {
                    cells.push(currentCell);
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            cells.push(currentCell);
            return cells;
        }
    </script>
</body>

</html>
